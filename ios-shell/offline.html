<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FleetFlow — offline</title>
</head>
<body style="margin:0;background:#0b1220;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom))">
  <div>
    <h1 style="font-size:22px;margin:0 0 8px">You're offline</h1>
    <p style="opacity:.75;max-width:280px;margin:0 auto">FleetFlow needs a connection to sync prestarts, defects and your account.</p>
    <button type="button" onclick="location.href='https://fleetflow.group/'" style="margin-top:20px;padding:12px 20px;border-radius:10px;border:0;background:#f59e0b;color:#111;font-weight:600">Try again</button>
  </div>
